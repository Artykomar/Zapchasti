name: Deploy Yandex Cloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment with Yandex Cloud variables and approval rules
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment variables
        env:
          YC_SERVICE_ACCOUNT_ID: ${{ vars.YC_SERVICE_ACCOUNT_ID }}
          YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
          YC_VM_ID: ${{ vars.YC_VM_ID }}
          ZEMAZAP_DEPLOY_URL: ${{ vars.ZEMAZAP_DEPLOY_URL }}
        run: |
          test -n "$YC_SERVICE_ACCOUNT_ID"
          test -n "$YC_REGISTRY_ID"
          test -n "$YC_VM_ID"
          test -n "$ZEMAZAP_DEPLOY_URL"

      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('id_token', await core.getIDToken())

      - name: Exchange OIDC token for Yandex IAM token
        id: iam
        env:
          YC_SERVICE_ACCOUNT_ID: ${{ vars.YC_SERVICE_ACCOUNT_ID }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.id_token }}
        run: |
          IAM_TOKEN=$(curl --fail --silent --show-error \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange&requested_token_type=urn:ietf:params:oauth:token-type:access_token&audience=$YC_SERVICE_ACCOUNT_ID&subject_token=$OIDC_TOKEN&subject_token_type=urn:ietf:params:oauth:token-type:id_token" \
            -X POST https://auth.yandex.cloud/oauth/token | jq -r '.access_token')
          test -n "$IAM_TOKEN"
          echo "::add-mask::$IAM_TOKEN"
          echo "iam_token=$IAM_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable images
        env:
          IAM_TOKEN: ${{ steps.iam.outputs.iam_token }}
          YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
        run: |
          echo "$IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker build -f Dockerfile.frontend -t "cr.yandex/$YC_REGISTRY_ID/zemazap-frontend:$GITHUB_SHA" .
          docker build -f backend/Dockerfile -t "cr.yandex/$YC_REGISTRY_ID/zemazap-backend:$GITHUB_SHA" .
          docker push "cr.yandex/$YC_REGISTRY_ID/zemazap-frontend:$GITHUB_SHA"
          docker push "cr.yandex/$YC_REGISTRY_ID/zemazap-backend:$GITHUB_SHA"

      - name: Install Yandex Cloud CLI
        run: curl --fail --silent --show-error https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n

      - name: Roll out the exact commit on VM
        env:
          IAM_TOKEN: ${{ steps.iam.outputs.iam_token }}
          YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
          YC_VM_ID: ${{ vars.YC_VM_ID }}
        run: |
          "$HOME/yc/bin/yc" config set token "$IAM_TOKEN"
          "$HOME/yc/bin/yc" compute ssh --id "$YC_VM_ID" --command \
            "cd /opt/zemazap && git fetch origin main && git checkout --detach $GITHUB_SHA && YC_REGISTRY_ID=$YC_REGISTRY_ID IMAGE_TAG=$GITHUB_SHA docker compose -f compose.yandex.yml pull && YC_REGISTRY_ID=$YC_REGISTRY_ID IMAGE_TAG=$GITHUB_SHA docker compose -f compose.yandex.yml up -d --remove-orphans"

      - name: Smoke check deployed version
        env:
          ZEMAZAP_SMOKE_BASE_URL: ${{ vars.ZEMAZAP_DEPLOY_URL }}
        run: python scripts/smoke-check.py
