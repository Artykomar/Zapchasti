name: zemazap

services:
  django:
    image: cr.yandex/${YC_REGISTRY_ID:?Set YC_REGISTRY_ID}/zemazap-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    env_file: [/etc/zemazap/backend.env]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend, edge]

  scheduler:
    image: cr.yandex/${YC_REGISTRY_ID:?Set YC_REGISTRY_ID}/zemazap-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    entrypoint: ["python", "backend/manage.py", "run_operations_scheduler"]
    env_file: [/etc/zemazap/backend.env]
    depends_on:
      django:
        condition: service_healthy
    networks: [backend, edge]

  frontend:
    image: cr.yandex/${YC_REGISTRY_ID:?Set YC_REGISTRY_ID}/zemazap-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    env_file: [/etc/zemazap/frontend.env]
    environment:
      ZEMAZAP_DJANGO_API_URL: http://django:8000
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [edge]

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      django:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [edge]

networks:
  edge:
  backend:
    internal: true
