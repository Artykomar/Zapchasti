name: zemazap

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zemazap}
      POSTGRES_USER: ${POSTGRES_USER:-zemazap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zemazap} -d ${POSTGRES_DB:-zemazap}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  django:
    image: zemazap-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: [backend/.env]
    environment:
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-zemazap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zemazap}
      DATABASE_SSL_REQUIRE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend, edge]

  scheduler:
    image: zemazap-backend:local
    restart: unless-stopped
    entrypoint: ["python", "backend/manage.py", "run_operations_scheduler"]
    env_file: [backend/.env]
    environment:
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-zemazap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zemazap}
      DATABASE_SSL_REQUIRE: "false"
    depends_on:
      django:
        condition: service_healthy
    networks: [backend, edge]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    env_file: [.env]
    environment:
      ZEMAZAP_DJANGO_API_URL: http://django:8000
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [edge]

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      django:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge]

volumes:
  postgres-data:

networks:
  edge:
  backend:
    internal: true
