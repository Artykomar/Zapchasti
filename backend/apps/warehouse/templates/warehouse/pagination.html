<nav class="pagination" aria-label="Страницы списка">{% if page.has_previous %}<a href="?q={{ q|urlencode }}&amp;status={{ status|urlencode }}&amp;kind={{ kind|urlencode }}&amp;page={{ page.previous_page_number }}">← Назад</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }} · Всего {{ page.paginator.count }}</span>{% if page.has_next %}<a href="?q={{ q|urlencode }}&amp;status={{ status|urlencode }}&amp;kind={{ kind|urlencode }}&amp;page={{ page.next_page_number }}">Далее →</a>{% endif %}</nav>
